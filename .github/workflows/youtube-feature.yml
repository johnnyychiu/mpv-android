name: YouTube feature build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Android SDK platform and packaging NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          printf 'ndkVersion=28.2.13676358\n' > ndk.properties

      - name: Fetch pinned upstream source tag
        run: git fetch https://github.com/mpv-android/mpv-android.git tag 2026-09-17

      - name: Prepare verified upstream natives
        run: python3 buildscripts/prepare-release-natives.py

      - name: Test, lint, and build app
        run: ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultDebug :app:lintDefaultDebug

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-youtube-debug-apks
          path: app/build/outputs/apk/default/debug/*.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-unit-test-results
          path: app/build/reports/tests/testDefaultDebugUnitTest/
